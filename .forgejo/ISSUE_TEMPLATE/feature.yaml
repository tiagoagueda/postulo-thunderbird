name: Feature request
about: Ask for something the Thunderbird extension does not do yet.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Write in whatever language you can; English is easiest for the maintainer to act on.

        Describe the problem before the solution: a feature is judged by the problem it removes. Do not paste personal details such as a CV, an address, the name of somebody you applied to, or a mail.
  - type: textarea
    id: problem
    attributes:
      label: The problem, and who has it
      description: What gets in the way, for whom, and how often.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other ways to solve it, and what you do today.
  - type: dropdown
    id: scope
    attributes:
      label: Whose job is it?
      description: If the core has to change too (what the capture API accepts, how a page is read on the server), it gets an issue of its own; code shared with the browser extension changes in postulo-chromium.
      options:
        - The Thunderbird extension's
        - Code shared with the browser extension (postulo-chromium)
        - The core's (postulo/postulo)
        - Not sure
    validations:
      required: true
