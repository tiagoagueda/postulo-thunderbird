name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The whole history: the translation guard reads every commit it is given.
          fetch-depth: 0
      - run: npm ci
      - name: Refuse a high advisory in the dev chain
        # web-ext runs on a contributor's machine and in CI, not in the extension; scripts/audit.mjs
        # fails on a new high or critical advisory and names the one allowed (no fixed release).
        run: npm run audit
      - name: Refuse translations written outside Weblate
        # Every translation is made at translate.tiagoagueda.com and comes back as Weblate's
        # pull request (postulo/postulo#706); a commit that writes one anywhere else fails.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/guard.mjs
      - name: Test the pure parts, the catalogues, the manifest and the shared files
        run: npm test
      - name: Check the shared files against postulo-chromium itself
        # `npm test` only compares the copies with shared.json, which a change can edit too;
        # this fetches postulo-chromium and compares the hashes with its files at the recorded commit.
        run: npm run shared:verify
      # web-ext's linter is Firefox's: it warns about `messagesRead`, which is Thunderbird's
      # own permission, and fails only on an error.
      - name: Lint with web-ext
        run: npm run lint
      - name: Package
        run: npm run build
      - uses: actions/upload-artifact@v3
        continue-on-error: true
        with:
          name: extension-package
          path: dist
