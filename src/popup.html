<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Postulo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header>
      <img src="icons/postulo.svg" alt="" width="20" height="20" />
      <h1>Postulo</h1>
      <!-- At the end of the header (the left in a right-to-left language), in this order for the keyboard. -->
      <div class="header-actions">
        <button id="capture" type="button" class="icon" aria-label="Capture this posting" title="Capture this posting" data-i18n-label="capture" disabled>
          <!-- lucide-static v1.41.0, ISC -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M12 15V3" />
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="m7 10 5 5 5-5" />
          </svg>
        </button>
        <button id="new-listing" type="button" class="icon" aria-label="Add a listing from scratch" title="Add a listing from scratch" data-i18n-label="newListing" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M5 12h14" />
            <path d="M12 5v14" />
          </svg>
        </button>
      </div>
    </header>

    <p id="not-connected" class="note" hidden>
      <span data-i18n="notConnected">Not connected to a Postulo yet.</span>
      <button id="open-options" type="button" class="link" data-i18n="setUp">Set it up</button>
    </p>

    <!-- The message Thunderbird is showing: read here, and sent nowhere. -->
    <section id="message" aria-labelledby="message-heading">
      <h2 id="message-heading" class="hint" data-i18n="messageHeading">The message on screen</h2>
      <p id="subject"></p>
      <p id="sender" class="muted small"></p>
    </section>

    <!-- Why the capture button is off, in words: nothing on screen, several messages, or not set up. -->
    <p id="why-not" class="note" hidden></p>
    <p id="no-address" class="note" hidden data-i18n="noAddress">This message has no link to a posting, so there is nothing to capture.</p>

    <!-- File the message on screen into a listing's history: offered when the token may. -->
    <section id="file" aria-label="File this message" hidden>
      <button id="file-open" type="button" data-i18n="fileMessage">File this message into a listing</button>
      <div id="file-panel" class="posting" hidden>
        <label for="f-search" data-i18n="searchListings">Search your listings</label>
        <input id="f-search" type="search" autocomplete="off" />
        <p id="no-listings" class="muted small" hidden data-i18n="noListings">No listing matches.</p>
        <ul id="choices" class="review-rows"></ul>
        <label class="check">
          <input id="subject-only" type="checkbox" />
          <span data-i18n="subjectOnly">Send the subject alone</span>
        </label>
        <details open>
          <summary data-i18n="whatIsSent">What will be sent</summary>
          <textarea id="file-body" rows="6" readonly></textarea>
        </details>
        <div class="send">
          <button id="file-send" type="button" class="primary" data-i18n="fileIt" disabled>File it</button>
        </div>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <!-- The postings the badge counts and the rest of the queue, newest first: what needs review. -->
    <section id="review-list" aria-labelledby="review-heading" hidden>
      <h2 id="review-heading" class="hint" data-i18n="reviewHeading">Needs review</h2>
      <p id="review-stale" class="muted small" hidden></p>
      <p id="review-empty" class="muted" hidden data-i18n="nothingWaiting">Nothing is waiting for review.</p>
      <ul id="review-rows" class="review-rows"></ul>
      <p class="captures-link" id="review-all" hidden><a id="all-captures" href="#"></a></p>
    </section>

    <footer>
      <!-- Whether Postulo answers, one shape for each state so colour is never the only sign; the
           script shows one. lucide-static v1.41.0, ISC, like the gear. -->
      <span id="state" class="state" role="img" hidden>
        <svg data-state="online" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>
        <svg data-state="slow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
        <svg data-state="unreachable" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg>
        <svg data-state="testing" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" /><path d="M6.453 15h11.094" /><path d="M8.5 2h7" /></svg>
        <svg data-state="mailOffline" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" /><path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" /><path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" /></svg>
        <svg data-state="noPermission" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
        <svg data-state="tokenRefused" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /><circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></svg>
      </span>
      <a id="server" class="server" href="#" target="_blank" rel="noopener" hidden></a>
      <button id="options-link" type="button" class="icon" aria-label="Settings" title="Settings" data-i18n-label="settings">
        <!-- The core's settings icon, as the browser extension has it: lucide-static v1.41.0, ISC. -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
